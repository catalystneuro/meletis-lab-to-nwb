FiberPhotometry:
  # Session-specific indicator_label and location are overridden in convert_session.py
  # based on the `group` column in details.csv, matching the same group keys used in the
  # water-consumption conversion (dLight_dStr / dLight_vStr → dLight1.3b in striatum;
  # fp_dat / fp_anxa1 → jGCaMP8m in SN cell bodies).
  # Placeholder defaults below are for the dLight-in-striatum case.
  location: Caudoputamen
  indicator_label: dLight1.3b
  excitation_wavelength_in_nm: 470.0
  emission_wavelength_in_nm: 525.0

  ExcitationSourceModel_470nm:
    # 470 nm LED for signal channel. Doric system (ref 101 in Mantas et al. 2026).
    # Power 20-30 µW (Mantas et al. 2026, line 917-918).
    name: doric_470nm_led_model
    manufacturer: Doric
    source_type: "LED"
    excitation_mode: "one-photon"
    # wavelength_range_in_nm is computed from excitation_wavelength_in_nm in code.

  ExcitationSourceModel_405nm:
    # 405 nm LED for isosbestic reference channel.
    # Power 15-25 µW (Mantas et al. 2026, line 918-919).
    name: doric_405nm_led_model
    manufacturer: Doric
    source_type: "LED"
    excitation_mode: "one-photon"
    wavelength_in_nm: 405.0

  OpticalFiberModel:
    # 400 µm ceramic ferrule fiber optic cannula, NA 0.22, Doric.
    # Specs from Mantas et al. (2026), Implant placement, lines 652-654.
    name: doric_400um_cannula_model
    manufacturer: Doric
    numerical_aperture: 0.22
    core_diameter_in_um: 400.0
    ferrule_name: "ceramic ferrule"

  ExcitationSourceSignal:
    name: excitation_source_signal
    description: >-
      470 nm Doric LED for fiber photometry signal-channel excitation (20-30 µW).
      Interleaved with the 405 nm isosbestic reference via DoricStudio V5 software.

  ExcitationSourceIsosbestic:
    name: excitation_source_isosbestic
    description: >-
      405 nm Doric LED for fiber photometry isosbestic-reference excitation (15-25 µW).

  # FiberInsertion is injected per-session by convert_session.py based on details.csv `group`.
  # CPu coordinates are the same across all FP experiments (Mantas et al. 2026, Implant
  # placement, p.15). SNc coordinates for fp_dat/fp_anxa1 are not reported — see LAB_REVIEW W2.
  FiberInsertions:
    dLight_dStr:
      # dCP (dorsal caudoputamen) from Mantas et al. 2026, Implant placement.
      name: fiber_insertion
      insertion_position_ap_in_mm: 0.74
      insertion_position_ml_in_mm: 1.5
      insertion_position_dv_in_mm: -2.2
      position_reference: "(AP, ML, DV) = (0, 0, 0) corresponds to bregma at the cortical surface"
      hemisphere: right
    dLight_vStr:
      # cCP (central caudoputamen) — same coordinates as opto+dLight vStr sessions.
      name: fiber_insertion
      insertion_position_ap_in_mm: 0.38
      insertion_position_ml_in_mm: 2.0
      insertion_position_dv_in_mm: -2.9
      position_reference: "(AP, ML, DV) = (0, 0, 0) corresponds to bregma at the cortical surface"
      hemisphere: right
    # fp_dat and fp_anxa1: SNc FP fiber coordinates not reported in manuscript — see LAB_REVIEW W2.

  OpticalFiber:
    name: optical_fiber
    description: >-
      Doric 400 µm ceramic ferrule fiber optic cannula for fiber photometry recording.
      Per-session implantation target (striatum vs SN) is reflected in the linked
      FiberPhotometryTable location column.

  Photodetector:
    name: photodetector
    description: "Photodetector for fiber photometry signal and reference channels."

  ProcessingModule:
    name: ophys
    description: >-
      Processed optical physiology data. Contains motion-corrected dF/F fluorescence
      signals from open field test fiber photometry recordings.

  FiberPhotometryLabMetaData:
    name: fiber_photometry

  FiberPhotometryTable:
    name: fiber_photometry_table
    description: "Fiber photometry metadata table for the open field test."

  DfOverFFiberPhotometryResponseSeries:
    name: DfOverFFiberPhotometryResponseSeries
    description: >-
      Motion-corrected dF/F fiber photometry signal for indicator {indicator_label}.
      Preprocessing in DoricStudio V5 (Mantas et al. 2026, lines 920-924): raw 470 nm
      and 405 nm fluorescence traces were baseline-normalized (dF/F) and low-pass
      filtered (10 Hz cutoff); the normalized 405 nm isosbestic trace was then scaled
      to the 470 nm baseline and subtracted to remove shared artifacts (motion,
      photobleaching). Acquired via interleaved 470/405 nm LED excitation at ~60 Hz.
      Corrected dF/F traces were aligned to behavioral events (VAME motif onsets) for
      downstream peri-event analyses. Original signal column: {signal_column}.
    table_region_description: "470 nm signal channel (dF/F)."

  # Indicator is NOT set here — it is injected per-session by convert_session.py based on
  # the `group` column in details.csv. Keys match the same group labels used in the
  # water-consumption conversion.
  Indicators:
    dLight_dStr:
      # dLight1.3b injected into dorsal caudoputamen (dCP); records DA release during OFT.
      name: dLight1.3b
      manufacturer: Addgene
      description: >-
        Genetically encoded dopamine indicator dLight1.3b (AAV5-CAG-dLight1.3b, Addgene
        plasmid #125560). Delivered via unilateral striatal injection into the dorsal
        caudoputamen (dCP; Mantas et al. 2026, lines 628-629 and 656-658). Records
        dopamine release dynamics during open field exploration.
    dLight_vStr:
      # dLight1.3b injected into central caudoputamen (cCP); records DA release during OFT.
      # Note: `vStr` in details.csv likely corresponds to cCP (central caudoputamen) per
      # manuscript. See LAB_REVIEW.md Q3.
      name: dLight1.3b
      manufacturer: Addgene
      description: >-
        Genetically encoded dopamine indicator dLight1.3b (AAV5-CAG-dLight1.3b, Addgene
        plasmid #125560). Delivered via unilateral striatal injection into the central
        caudoputamen (cCP; assuming `vStr` in details.csv corresponds to the manuscript's
        cCP target — see LAB_REVIEW.md Q3). Records dopamine release dynamics during
        open field exploration.
    fp_dat:
      # jGCaMP8m in SN cell bodies via Cre-dependent AAV in DAT-Cre mice; records
      # calcium activity of pan-DA SN dopamine neurons during OFT.
      name: jGCaMP8m
      manufacturer: Addgene
      description: >-
        Genetically encoded calcium indicator jGCaMP8m expressed pan-DA in SN dopamine
        neurons via a Cre-dependent AAV in DAT-Cre mice. Delivered as 300 nL unilateral
        injection of pGP-AAV9-CAG-FLEX-jGCaMP8m-WPRE (Addgene #162381) into the SN
        compact part. Records calcium dynamics of DAT+ dopamine neurons during open
        field exploration.
    fp_anxa1:
      # jGCaMP8m in SN cell bodies via Flp-dependent AAV in Anxa1-Flp mice; records
      # calcium activity of Anxa1+ SN dopamine neurons during OFT.
      name: jGCaMP8m
      manufacturer: VVF Zurich
      description: >-
        Genetically encoded calcium indicator jGCaMP8m selectively expressed in Anxa1+
        SN dopamine neurons via a Flp-dependent AAV in Anxa1-Flp mice. Delivered as
        300-500 nL unilateral injection of AAV-DJ/2-hSyn1-chl-dFRT-jGCaMP8m(rev)-dFRT-
        WPRE-bGHp (VVF Zurich) into the SN compact part. Records calcium dynamics of
        Anxa1+ dopamine neurons during open field exploration.
    # OFT-specific group label for pan-DA DAT-Cre mice; same indicator as fp_dat.
    dat-cre:
      name: jGCaMP8m
      manufacturer: Addgene
      description: >-
        Genetically encoded calcium indicator jGCaMP8m expressed pan-DA in SN dopamine
        neurons via a Cre-dependent AAV in DAT-Cre mice. Delivered as 300 nL unilateral
        injection of pGP-AAV9-CAG-FLEX-jGCaMP8m-WPRE (Addgene #162381) into the SN
        compact part. Records calcium dynamics of DAT+ dopamine neurons during open
        field exploration.
    # OFT-specific group label for Anxa1-Flp mice; same indicator as fp_anxa1.
    anxa1-flp:
      name: jGCaMP8m
      manufacturer: VVF Zurich
      description: >-
        Genetically encoded calcium indicator jGCaMP8m selectively expressed in Anxa1+
        SN dopamine neurons via a Flp-dependent AAV in Anxa1-Flp mice. Delivered as
        300-500 nL unilateral injection of AAV-DJ/2-hSyn1-chl-dFRT-jGCaMP8m(rev)-dFRT-
        WPRE-bGHp (VVF Zurich) into the SN compact part. Records calcium dynamics of
        Anxa1+ dopamine neurons during open field exploration.

  RawSignalFiberPhotometryResponseSeries:
    name: FiberPhotometryResponseSeries
    description: >-
      Raw 470 nm fluorescence signal from fiber photometry acquisition (DoricStudio V5).
    table_region_description: "470 nm signal channel (raw fluorescence)."

  RawReferenceFiberPhotometryResponseSeries:
    name: FiberPhotometryResponseSeriesIsosbestic
    description: >-
      Raw 405 nm isosbestic reference fluorescence from fiber photometry acquisition
      (DoricStudio V5).
    table_region_description: "405 nm isosbestic control (raw fluorescence)."
